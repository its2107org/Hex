# Our copy of Hex (its2107org)
name: 4. Check it builds
on:
  workflow_dispatch:

jobs:
  compile:
    name: Build without signing
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app
          scripts/select-xcode.sh
      - name: Prepare the project
        run: scripts/prepare.sh
        env:
          TEAMID: ABCDE12345
      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project ios/HEXMobile.xcodeproj -scheme HEXMobile -configuration Release \
            -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|BUILD" || true
          grep -q "BUILD SUCCEEDED" build.log || { grep -E "error:" build.log | sort -u | head -20 | while read -r l; do echo "::error::${l:0:400}"; done; exit 1; }
