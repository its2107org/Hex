# Our copy of Hex (its2107org)
name: 3. Build Hex
run-name: Build Hex for TestFlight
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    # Rebuild on the 1st of every month so the TestFlight copy never expires (they last 90 days).
    - cron: "23 5 1 * *"

concurrency:
  group: build-hex
  cancel-in-progress: false

jobs:
  build:
    name: Build and send to TestFlight
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - name: Select Xcode
        run: scripts/select-xcode.sh
      - name: Install fastlane
        run: bundle install
      - name: Prepare the project with Ian's Apple team
        run: scripts/prepare.sh
        env:
          TEAMID: ${{ secrets.TEAMID }}
      - name: Sync clock
        run: sudo sntp -sS time.windows.com || true
      - name: Build
        run: bundle exec fastlane build_hex
        env:
          TEAMID: ${{ secrets.TEAMID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      - name: Show build errors
        if: failure()
        run: |
          f=$(ls buildlog/*.log 2>/dev/null | head -1) || true
          [ -n "$f" ] && grep -E "error:|Provisioning profile" "$f" | sort -u | head -20 | while read -r l; do echo "::error::${l:0:400}"; done || true
      - name: Check the keyboard can share with the app
        run: |
          rm -rf /tmp/ipa && mkdir /tmp/ipa && unzip -q Hex.ipa -d /tmp/ipa
          for b in /tmp/ipa/Payload/*.app /tmp/ipa/Payload/*.app/PlugIns/*.appex; do
            if codesign -d --entitlements :- "$b" 2>/dev/null | grep -q "group.its2107org.hex"; then
              echo "::notice::$(basename "$b") has the App Group"
            else
              echo "::warning::$(basename "$b") has no App Group"
            fi
          done
      - name: Send to TestFlight
        run: bundle exec fastlane release
        env:
          TEAMID: ${{ secrets.TEAMID }}
          FASTLANE_KEY_ID: ${{ secrets.FASTLANE_KEY_ID }}
          FASTLANE_ISSUER_ID: ${{ secrets.FASTLANE_ISSUER_ID }}
          FASTLANE_KEY: ${{ secrets.FASTLANE_KEY }}
      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: |
            buildlog
            *.ipa
